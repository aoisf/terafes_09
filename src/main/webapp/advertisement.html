<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>あれ？ここには何もないよ。｜たまごろう</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:36px 20px;background:#f8f5ed;color:#403729;font-family:"Yu Gothic","Meiryo",sans-serif;background-image:radial-gradient(#cbbf9f45 1px,transparent 1px);background-size:24px 24px}main{width:min(760px,100%);text-align:center}.eyebrow{font-size:11px;letter-spacing:.3em;color:#9d8a63;margin:0 0 28px}.speech{position:relative;padding:34px 25px;background:#fffefb;border:1px solid #ddcfb2;border-radius:26px;box-shadow:0 12px 40px #80662e0a}.speech:after{content:"";position:absolute;bottom:-11px;left:calc(50% - 10px);width:20px;height:20px;transform:rotate(45deg);background:#fffefb;border-right:1px solid #ddcfb2;border-bottom:1px solid #ddcfb2}h1{font-size:clamp(23px,4vw,34px);line-height:1.6;margin:0 0 12px;letter-spacing:.03em}p{font-size:14px;line-height:2;margin:8px 0;color:#84765e}.mascot{position:relative;width:240px;margin:24px auto 0}.mascot img{width:220px;height:220px;object-fit:contain;image-rendering:pixelated;animation:hello 3s ease-in-out infinite;filter:drop-shadow(0 12px 8px #8a704316)}.name{display:inline-block;border:1px solid #d9c8a3;border-radius:30px;background:#fffdf5;padding:6px 15px;font-size:12px;color:#74613b}.home{display:inline-block;margin:25px 0 14px;padding:14px 30px;background:#243344;color:#fff5d8;border:1px solid #c0a468;border-radius:9px;text-decoration:none;font-size:14px;box-shadow:0 4px 0 #15202d}.home:hover{background:#33485e}.home:focus-visible{outline:3px solid #c49c48;outline-offset:5px}.note{font-size:11px;color:#ab9b7f}@keyframes hello{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}@media(prefers-reduced-motion:reduce){.mascot img{animation:none}}
</style>
</head>
<body><main>
<div class="eyebrow">TAMAGORO'S LITTLE DETOUR · 404</div>
<div class="speech"><h1>このページは存在しないよ！</h1><p>広告、気になっちゃった？<br>ぼくも見にきたけど、まだ何もなかったんだ。</p><p>せっかくだし、お部屋に戻っていっしょにあそぼ！</p></div>
<div class="mascot"><img src="images/pets/tamagoro/lv1.png" alt="Lv1のたまごろうがこちらに話しかけています" width="220" height="220"></div>

<a class="home" href="main">たまごろうのお部屋へ戻る　→</a>
<p class="note">この広告の商品・リンク先は、パチペット生活の架空のものです。</p>
</main>
<script>
(function () {
    var source = new URLSearchParams(window.location.search).get('from');
    var backLink = document.querySelector('a.home');
    if (source === 'borscht' || source === 'jingisukan') {
        backLink.href = 'food';
        backLink.textContent = 'ごはん画面へ戻る　→';
        document.querySelector('.speech p:last-child').textContent = 'ごはんの時間に戻ろう！ぼく、おなかすいちゃった。';
    } else if (source === 'janken' || source === 'pachinko-opening') {
        backLink.href = 'play';
        backLink.textContent = 'あそぶ画面へ戻る　→';
        document.querySelector('.speech p:last-child').textContent = 'こっちで、ぼくといっしょにあそぼ！';
    } else if (source === 'shopping-mall' || source === 'vintage-shop') {
        backLink.href = 'dress';
        backLink.textContent = 'おきがえ画面へ戻る　→';
        document.querySelector('.speech p:last-child').textContent = 'おきがえに戻ろう！ぼくに似合う服、選んでね。';
    }
})();
</script>
</body></html>
